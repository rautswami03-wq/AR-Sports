<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Scoreboard Overlay</title>

  <!-- Google Fonts — loaded dynamically per theme, but cache common ones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* =========================================================================
       OBS TRANSPARENT BACKGROUND — CRITICAL
       ======================================================================= */
    html, body {
      margin: 0; padding: 0;
      width: 1920px; height: 1080px;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
    }

    /* =========================================================================
       ROOT LAYOUT
       ======================================================================= */
    #sb-root {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--sb-font-primary, 'Inter', system-ui, sans-serif);
      max-width: 1920px;
    }

    /* =========================================================================
       CSS CUSTOM PROPERTIES — default (classic theme)
       Override by JS applyTheme()
       ======================================================================= */
    :root {
      --sb-bg-primary:       linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --sb-bg-secondary:     rgba(15, 23, 42, 0.95);
      --sb-bg-accent:        #1d4ed8;
      --sb-bg-ticker:        #0f172a;
      --sb-text-primary:     #f8fafc;
      --sb-text-secondary:   #94a3b8;
      --sb-text-accent:      #60a5fa;
      --sb-text-muted:       #64748b;
      --sb-accent-primary:   #3b82f6;
      --sb-accent-secondary: #1d4ed8;
      --sb-accent-gold:      #f59e0b;
      --sb-border-color:     rgba(59, 130, 246, 0.3);
      --sb-glow-color:       rgba(59, 130, 246, 0.4);
      --sb-glow-strength:    0 0 16px;
      --sb-ball-dot-0:       #1e293b;
      --sb-ball-dot-1:       #334155;
      --sb-ball-dot-4:       #d97706;
      --sb-ball-dot-6:       #16a34a;
      --sb-ball-dot-w:       #dc2626;
      --sb-ball-dot-wd:      #7c3aed;
      --sb-ball-dot-nb:      #ea580c;
      --sb-flash-four:       #f59e0b;
      --sb-flash-six:        #22c55e;
      --sb-flash-wicket:     #ef4444;
      --sb-flash-extra:      #eab308;
      --sb-font-primary:     'Inter', system-ui, sans-serif;
      --sb-font-mono:        'Inter', monospace;
      --sb-border-radius:    12px;
      --sb-strip-height:     72px;
      --sb-backdrop-blur:    0px;
    }

    /* =========================================================================
       GLOBAL KEYFRAMES
       ======================================================================= */
    @keyframes sb-slot-in {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes sb-slot-out {
      from { transform: translateY(0);     opacity: 1; }
      to   { transform: translateY(-100%); opacity: 0; }
    }
    @keyframes sb-breathing-glow {
      0%, 100% { box-shadow: var(--sb-glow-strength) var(--sb-glow-color); }
      50%       { box-shadow: 0 0 32px 4px var(--sb-glow-color); }
    }
    @keyframes sb-pulse-four {
      0%, 100% { opacity: 0; }
      25%, 75%  { background: var(--sb-flash-four); opacity: 0.18; }
    }
    @keyframes sb-pulse-six {
      0%, 100%       { opacity: 0; }
      20%, 50%, 80%  { background: var(--sb-flash-six); opacity: 0.22; }
    }
    @keyframes sb-pulse-wicket {
      0%, 100%           { opacity: 0; }
      15%, 40%, 60%, 85% { background: var(--sb-flash-wicket); opacity: 0.28; }
    }
    @keyframes sb-pulse-extra {
      0%, 100% { opacity: 0; }
      50%       { background: var(--sb-flash-extra); opacity: 0.15; }
    }
    @keyframes sb-ball-chip-in {
      from { transform: translateX(40px) scale(0.6); opacity: 0; }
      to   { transform: translateX(0) scale(1); opacity: 1; }
    }
    @keyframes sb-slide-in-up {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes sb-celebration-in {
      from { transform: scale(0.35) translateY(30px); opacity: 0; }
      to   { transform: scale(1) translateY(0);       opacity: 1; }
    }
    @keyframes sb-ticker-flash-slide {
      from { transform: translateX(-100%); }
      to   { transform: translateX(0); }
    }
    @keyframes sb-gradient-wave {
      0%, 100% { background-position: 0% 50%; }
      50%       { background-position: 100% 50%; }
    }
    @keyframes sb-neon-pulse {
      0%, 100% { text-shadow: 0 0 8px currentColor, 0 0 20px currentColor; }
      50%       { text-shadow: 0 0 4px currentColor, 0 0 50px currentColor, 0 0 80px currentColor; }
    }
    @keyframes sb-particle {
      from { transform: translate(0,0) rotate(0deg); opacity: 1; }
      to   { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
    }
    @keyframes sb-hundred-bounce {
      from { transform: scale(1.5); color: var(--sb-accent-primary); }
      to   { transform: scale(1); }
    }
    @keyframes sb-vignette-wicket {
      0%, 100% { box-shadow: inset 0 0 0 rgba(220,38,38,0); }
      30%, 70% { box-shadow: inset 0 0 80px rgba(220,38,38,0.35); }
    }

    /* =========================================================================
       SCORE STRIP — common structural styles
       ======================================================================= */
    .sb-strip {
      display: flex;
      align-items: stretch;
      overflow: hidden;
      width: 100%;
      background: var(--sb-bg-primary);
      border: 1.5px solid var(--sb-border-color);
      border-radius: var(--sb-border-radius);
      min-height: var(--sb-strip-height);
      box-shadow: 0 4px 32px rgba(0,0,0,0.5), var(--sb-glow-strength) var(--sb-glow-color);
      position: relative;
      animation: sb-slide-in-up 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    .sb-strip.glass {
      backdrop-filter: blur(var(--sb-backdrop-blur));
      -webkit-backdrop-filter: blur(var(--sb-backdrop-blur));
    }
    .sb-team-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      flex-shrink: 0;
      min-width: 130px;
      background: var(--sb-bg-accent);
      color: var(--sb-text-accent);
    }
    .sb-team-badge .name {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 18px;
      line-height: 1;
    }
    .sb-team-badge .label {
      font-size: 9px;
      font-weight: 700;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 3px;
    }
    .sb-score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      flex-shrink: 0;
      min-width: 150px;
      background: var(--sb-bg-accent);
    }
    .sb-score-main {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      color: var(--sb-text-accent);
      display: flex;
      align-items: center;
    }
    .sb-score-sub {
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      opacity: 0.8;
      color: var(--sb-text-accent);
    }
    /* Slot machine digit wrapper */
    .sb-digit {
      display: inline-block;
      overflow: hidden;
      height: 1em;
      line-height: 1em;
      vertical-align: bottom;
    }
    .sb-digit-inner {
      display: block;
      will-change: transform;
    }
    .sb-digit-inner.rolling {
      animation: sb-slot-in 0.3s cubic-bezier(0.34, 1.3, 0.64, 1) both;
    }
    .sb-center-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      min-width: 110px;
      flex-shrink: 0;
      border-right: 1px solid var(--sb-border-color);
      background: var(--sb-bg-secondary);
    }
    .sb-rate-group { display: flex; gap: 12px; }
    .sb-rate-item { display: flex; flex-direction: column; align-items: center; }
    .sb-rate-label { font-size: 10px; font-weight: 700; text-transform: uppercase; opacity: 0.5; color: var(--sb-text-secondary); }
    .sb-rate-value { font-size: 14px; font-weight: 900; color: var(--sb-text-primary); }
    .sb-rate-value.accent { color: var(--sb-accent-primary); }
    .sb-batters-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 16px;
      min-width: 200px;
      background: var(--sb-bg-secondary);
    }
    .sb-batter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }
    .sb-batter-row.striker { color: var(--sb-text-primary); margin-bottom: 3px; }
    .sb-batter-row.non-striker { color: var(--sb-text-secondary); opacity: 0.75; }
    .sb-striker-icon { color: var(--sb-accent-primary); margin-right: 6px; font-size: 10px; }
    .sb-balls-section {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 14px;
      flex-shrink: 0;
      border-left: 1px solid var(--sb-border-color);
      background: var(--sb-bg-secondary);
    }
    .sb-ball-chip {
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900;
      color: #fff;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .sb-ball-chip.new {
      animation: sb-ball-chip-in 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .sb-ball-chip.empty {
      border: 1px solid var(--sb-border-color);
      background: transparent;
    }
    /* Flash overlay layer */
    .sb-flash-overlay {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
    }
    .sb-strip[data-flash="four"]   .sb-flash-overlay { animation: sb-pulse-four   0.56s ease-in-out 2 both; }
    .sb-strip[data-flash="six"]    .sb-flash-overlay { animation: sb-pulse-six    0.52s ease-in-out 3 both; }
    .sb-strip[data-flash="wicket"] .sb-flash-overlay { animation: sb-pulse-wicket 0.40s ease-in-out 4 both; }
    .sb-strip[data-flash="extra"]  .sb-flash-overlay { animation: sb-pulse-extra  0.80s ease-in-out 1 both; }

    /* =========================================================================
       STATS PANELS
       ======================================================================= */
    .sb-panels-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .sb-batter-panel, .sb-bowler-panel {
      background: var(--sb-bg-secondary);
      border-radius: var(--sb-border-radius);
      border: 1px solid var(--sb-border-color);
      overflow: hidden;
      animation: sb-slide-in-up 0.5s 0.06s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    .sb-batter-panel { flex: 1; }
    .sb-bowler-panel { width: 380px; flex-shrink: 0; }
    .sb-panel-header {
      display: flex;
      align-items: center;
      padding: 7px 16px;
      border-bottom: 1px solid var(--sb-border-color);
      background: rgba(0,0,0,0.2);
    }
    .sb-panel-header .title {
      flex: 1;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--sb-text-muted);
    }
    .sb-panel-header .col {
      width: 40px;
      text-align: right;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--sb-text-muted);
    }
    .sb-stat-row {
      display: flex;
      align-items: center;
      padding: 10px 16px;
    }
    .sb-stat-row.striker-row {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--sb-accent-primary);
      animation: sb-breathing-glow 2s ease-in-out infinite;
    }
    .sb-stat-row.non-striker-row {
      border-top: 1px solid var(--sb-border-color);
      opacity: 0.8;
      border-left: 3px solid transparent;
    }
    .sb-stat-row.bowler-current {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--sb-accent-primary);
    }
    .sb-stat-row.bowler-prev {
      border-top: 1px solid var(--sb-border-color);
      opacity: 0.55;
      border-left: 3px solid transparent;
    }
    .sb-stat-name {
      flex: 1;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--sb-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sb-stat-name.secondary { color: var(--sb-text-secondary); font-weight: 700; font-size: 12px; }
    .sb-stat-cell {
      width: 40px;
      text-align: right;
      font-size: 13px;
      font-weight: 700;
      color: var(--sb-text-secondary);
    }
    .sb-stat-cell.highlight {
      font-size: 16px;
      font-weight: 900;
      color: var(--sb-text-accent);
    }
    .sb-wickets-cell { color: var(--sb-accent-primary); }
    .sb-eco-green  { color: #22c55e; }
    .sb-eco-amber  { color: #eab308; }
    .sb-eco-red    { color: #ef4444; }

    /* =========================================================================
       PARTNERSHIP BAR
       ======================================================================= */
    .sb-partnership {
      background: var(--sb-bg-secondary);
      border-radius: var(--sb-border-radius);
      border: 1px solid var(--sb-border-color);
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 16px;
      animation: sb-slide-in-up 0.5s 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    .sb-partnership-label { flex-shrink: 0; }
    .sb-partnership-label .title {
      font-size: 10px; font-weight: 900; text-transform: uppercase;
      letter-spacing: 0.2em; color: var(--sb-text-muted);
    }
    .sb-partnership-label .runs {
      font-size: 22px; font-weight: 900; color: var(--sb-text-accent); line-height: 1;
    }
    .sb-partnership-label .balls {
      font-size: 12px; font-weight: 700; color: var(--sb-text-secondary); opacity: 0.7; margin-left: 4px;
    }
    .sb-partnership-bars { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .sb-partnership-names {
      display: flex; justify-content: space-between;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: var(--sb-text-muted);
    }
    .sb-contrib-track {
      height: 16px; border-radius: 8px; overflow: hidden;
      background: rgba(0,0,0,0.3); border: 1px solid var(--sb-border-color);
      display: flex;
    }
    .sb-contrib-striker {
      height: 100%; background: var(--sb-accent-primary);
      display: flex; align-items: center; justify-content: flex-end; padding-right: 4px;
      font-size: 9px; font-weight: 900; color: #000;
      transition: width 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .sb-contrib-nonstriker {
      height: 100%; background: var(--sb-accent-secondary);
      flex: 1;
      display: flex; align-items: center; justify-content: flex-start; padding-left: 4px;
      font-size: 9px; font-weight: 900; color: #fff;
    }
    .sb-partnership-rr {
      flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center;
    }
    .sb-partnership-rr .rr-label { font-size: 10px; font-weight: 900; text-transform: uppercase; color: var(--sb-text-muted); opacity: 0.5; }
    .sb-partnership-rr .rr-value { font-size: 14px; font-weight: 900; color: var(--sb-text-primary); }

    /* =========================================================================
       SCORE TICKER
       ======================================================================= */
    .sb-ticker {
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      height: 36px;
      background: var(--sb-bg-ticker);
      border-top: 1px solid var(--sb-border-color);
      border-radius: 0 0 var(--sb-border-radius) var(--sb-border-radius);
      padding: 0 14px;
      gap: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--sb-text-primary);
    }
    .sb-ticker-content {
      display: flex;
      align-items: center;
      gap: 0;
      white-space: nowrap;
      width: 100%;
    }
    .sb-ticker-flash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
    }
    .sb-ticker-flash.active {
      animation: sb-ticker-flash-slide 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
      opacity: 1;
    }
    .sb-ticker-flash[data-type="four"]   { background: var(--sb-flash-four);   color: #000; }
    .sb-ticker-flash[data-type="six"]    { background: var(--sb-flash-six);    color: #fff; }
    .sb-ticker-flash[data-type="wicket"] { background: var(--sb-flash-wicket); color: #fff; }
    .sb-ticker-flash[data-type="extra"]  { background: var(--sb-flash-extra);  color: #000; }
    .sb-sep { opacity: 0.25; margin: 0 8px; color: var(--sb-text-muted); }
    .sb-accent { color: var(--sb-accent-primary); font-weight: 900; }
    .sb-ticker-ball {
      width: 18px; height: 18px;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 900;
      color: #fff;
      margin-left: 3px;
    }
    .sb-ticker-ball.new {
      animation: sb-ball-chip-in 0.42s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    /* =========================================================================
       PAGE CENTER CELEBRATION OVERLAY
       ======================================================================= */
    .sb-celebration-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      z-index: 999;
    }
    .sb-celebration-overlay.active { display: flex; }
    .sb-celebration-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 80px;
      border-radius: 32px;
      text-align: center;
      border: 4px solid rgba(255,255,255,0.3);
      box-shadow: 0 0 80px rgba(0,0,0,0.6);
      animation: sb-celebration-in 0.5s cubic-bezier(0.34,1.3,0.64,1) both;
      z-index: 10;
    }
    .sb-celebration-emoji { font-size: 72px; margin-bottom: 16px; display: block; }
    .sb-celebration-label {
      font-size: 80px; font-weight: 900; line-height: 1;
      text-transform: uppercase; letter-spacing: 0.1em;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .sb-celebration-sub {
      font-size: 20px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.4em;
      opacity: 0.75; margin-top: 8px;
    }
    .sb-celebration-batter {
      font-size: 28px; font-weight: 900; text-transform: uppercase; margin-top: 12px;
    }
    .sb-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: sb-particle var(--dur, 1000ms) cubic-bezier(0.25, 0.46, 0.45, 0.94) var(--delay, 0ms) both;
      --tx: 0px; --ty: 0px; --rot: 0deg;
    }

    /* =========================================================================
       THEME-SPECIFIC OVERRIDES
       Applied as class on #sb-root — no inline style needed after JS loads
       ======================================================================= */

    /* Glass theme backdrop */
    .theme-glass .sb-strip,
    .theme-glass .sb-batter-panel,
    .theme-glass .sb-bowler-panel,
    .theme-glass .sb-partnership {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Gradient wave animated background */
    .theme-gradient-wave .sb-strip {
      background-size: 400% 400% !important;
      animation: sb-gradient-wave 8s ease infinite, sb-slide-in-up 0.5s cubic-bezier(0.25,0.46,0.45,0.94) both;
    }

    /* Neon glow text effect on accent */
    .theme-neon-glow .sb-score-main,
    .theme-neon-glow .sb-rate-value.accent {
      animation: sb-neon-pulse 1.5s ease-in-out infinite;
    }

    /* Retro scan lines overlay */
    .theme-retro #sb-root::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 2px,
        rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px
      );
      z-index: 9999;
    }

    /* Angled team badge (IPL / T20 Blast) */

// ─────────────────────────────────────────────────────────────────────────────
// APPLY THEME
// ─────────────────────────────────────────────────────────────────────────────
function applyTheme(themeId) {
  const t = THEMES[themeId] || THEMES.classic;
  const root = document.documentElement;

  const vars = {
    '--sb-bg-primary':       t.bgPrimary,
    '--sb-bg-secondary':     t.bgSecondary,
    '--sb-bg-accent':        t.bgAccent,
    '--sb-bg-ticker':        t.bgTicker,
    '--sb-text-primary':     t.textPrimary,
    '--sb-text-secondary':   t.textSecondary,
    '--sb-text-accent':      t.textAccent,
    '--sb-text-muted':       t.textMuted,
    '--sb-accent-primary':   t.accentPrimary,
    '--sb-accent-secondary': t.accentSecondary,
    '--sb-accent-gold':      t.accentGold,
    '--sb-border-color':     t.borderColor,
    '--sb-glow-color':       t.glowColor,
    '--sb-glow-strength':    t.glowStrength,
    '--sb-ball-dot-0':       t.ballDot0,
    '--sb-ball-dot-1':       t.ballDot1,
    '--sb-ball-dot-4':       t.ballDot4,
    '--sb-ball-dot-6':       t.ballDot6,
    '--sb-ball-dot-w':       t.ballDotW,
    '--sb-ball-dot-wd':      t.ballDotWD,
    '--sb-ball-dot-nb':      t.ballDotNB,
    '--sb-flash-four':       t.flashFour,
    '--sb-flash-six':        t.flashSix,
    '--sb-flash-wicket':     t.flashWicket,
    '--sb-flash-extra':      t.flashExtra,
    '--sb-font-primary':     t.fontPrimary,
    '--sb-border-radius':    t.borderRadius,
    '--sb-strip-height':     t.stripHeight,
    '--sb-backdrop-blur':    t.backdropBlur || '0px',
  };
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v);

  // Apply font
  if (t.fontUrl) {
    const id = 'sb-font-' + themeId;
    if (!document.getElementById(id)) {
      const link = document.createElement('link');
      link.id = id; link.rel = 'stylesheet'; link.href = t.fontUrl;
      document.head.appendChild(link);
    }
  }
  document.body.style.fontFamily = t.fontPrimary;

  // Animated background
  const strip = document.getElementById('score-strip');
  if (t.animatedBg) {
    strip.style.backgroundSize = '400% 400%';
    strip.style.animation = 'sb-gradient-wave 8s ease infinite, sb-slide-in-up 0.5s cubic-bezier(0.25,0.46,0.45,0.94) both';
  }

  // Backdrop filter for glass
  if (t.backdropBlur && t.backdropBlur !== '0px') {
    [strip, ...document.querySelectorAll('.sb-batter-panel, .sb-bowler-panel, .sb-partnership')].forEach(el => {
      el.style.backdropFilter = `blur(${t.backdropBlur})`;
      el.style.webkitBackdropFilter = `blur(${t.backdropBlur})`;
    });
  }

  // Theme class on root
  document.getElementById('sb-root').className = `theme-${themeId}`;
  currentTheme = t;

  try { localStorage.setItem(THEME_STORAGE, themeId); } catch(e) {}
}

// ─────────────────────────────────────────────────────────────────────────────
let currentTheme = THEMES.classic;
let state = null;
let prevBallCount = 0;
let flashTimer = null;
let celebTimer = null;

const defaultState = {
  battingTeamId: 'teamA',
  teamA: {
    shortName: 'BAT', fullName: 'Batting Team', primaryColor: '#1d4ed8',
    score: 0, wickets: 0, overs: 0, balls: 0,
    batters: [
      { id: 'b1', name: 'Batsman 1', runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, isStriker: true },
      { id: 'b2', name: 'Batsman 2', runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, isStriker: false },
    ],
    bowlers: [{ id: 'bw1', name: 'Bowler 1', overs: 0, ballsInCurrentOver: 0, maidens: 0, runsConceded: 0, wickets: 0, economy: 0, isCurrent: true }],
  },
  teamB: {
    shortName: 'BWL', fullName: 'Bowling Team', primaryColor: '#dc2626',
    score: 0, wickets: 0, overs: 0, balls: 0,
    batters: [], bowlers: [],
  },
  matchDetails: {
    recentBalls: [], totalOvers: 20, targetRuns: null,
    customInputText: '', winnerMargin: '',
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render(s) {
  if (!s) return;
  state = s;

  const isTeamA = s.battingTeamId === 'teamA' || s.battingTeamId === s.teamA?.id || s.battingTeamId === s.teamA?.shortName;
  const bat = isTeamA ? s.teamA : s.teamB;
  const bwl = isTeamA ? s.teamB : s.teamA;
  const md  = s.matchDetails || {};

  const striker    = bat.batters?.find(b => b.isStriker && !b.isOut) || bat.batters?.[0];
  const nonStriker = bat.batters?.find(b => !b.isStriker && !b.isOut) || bat.batters?.[1];
  const bowler     = bwl.bowlers?.find(bw => bw.isCurrent) || bwl.bowlers?.[0];

  const totalBalls = bat.overs * 6 + bat.balls;
  const crr = totalBalls > 0 ? ((bat.score / totalBalls) * 6).toFixed(1) : '0.0';
  const rrr = md.targetRuns && totalBalls < 120
    ? Math.max(0, (md.targetRuns - bat.score) / Math.max(1, (120 - totalBalls) / 6)).toFixed(1)
    : null;

  // ── Score Strip ────────────────────────────────────────────────────────────
  setText('bat-name', bat.shortName || 'BAT');
  setText('bowl-name', bwl.shortName || 'BWL');
  setLogo('bat-logo', bat.logoUrl);
  setLogo('bowl-logo', bwl.logoUrl);
  setBadgeColor('bat-badge', bat.primaryColor);
  setBadgeColor('bowl-badge', bwl.primaryColor);

  // Slot-machine score
  const newScore = `${bat.score}/${bat.wickets}`;
  rollDigits('d-score', newScore);
  setText('score-sub', md.targetRuns ? `TGT ${md.targetRuns}` : `${bat.overs}.${bat.balls} OVS`);

  // CRR/RRR
  setText('crr-val', crr);
  if (rrr) {
    setText('rrr-val', rrr);
    document.getElementById('rrr-block').style.display = '';
  } else {
    document.getElementById('rrr-block').style.display = 'none';
  }

  // Partnership mini
  const pRuns = (striker?.runs || 0) + (nonStriker?.runs || 0);
  const pBalls = (striker?.balls || 0) + (nonStriker?.balls || 0);
  setText('partnership-mini', `P: ${pRuns}(${pBalls})`);

  // Batters quick view
  if (striker) {
    setText('striker-name', striker.name);
    setText('striker-runs', String(striker.runs));
    setText('striker-balls', ` (${striker.balls})`);
  }
  if (nonStriker) {
    setText('nonstriker-name', nonStriker.name);
    setText('nonstriker-runs', String(nonStriker.runs));
    setText('nonstriker-balls', ` (${nonStriker.balls})`);
  }

  // Ball chips
  renderBallChips(md.recentBalls || []);

  // ── Stats Panels ───────────────────────────────────────────────────────────
  if (striker) {
    setText('stat-striker-name', striker.name);
    animateStatCell('stat-striker-runs', striker.runs);
    setText('stat-striker-balls', String(striker.balls));
    setText('stat-striker-4s', String(striker.fours || 0));
    setText('stat-striker-6s', String(striker.sixes || 0));
    setText('stat-striker-sr', calcSR(striker.runs, striker.balls));
  }
  if (nonStriker) {
    setText('stat-nonstriker-name', nonStriker.name);
    setText('stat-nonstriker-runs', String(nonStriker.runs));
    setText('stat-nonstriker-balls', String(nonStriker.balls));
    setText('stat-nonstriker-4s', String(nonStriker.fours || 0));
    setText('stat-nonstriker-6s', String(nonStriker.sixes || 0));
    setText('stat-nonstriker-sr', calcSR(nonStriker.runs, nonStriker.balls));
  }
  if (bowler) {
    setText('stat-bowler-name', bowler.name);
    setText('stat-bowler-overs', `${bowler.overs}.${bowler.ballsInCurrentOver}`);
    setText('stat-bowler-maidens', String(bowler.maidens || 0));
    setText('stat-bowler-runs', String(bowler.runsConceded));
    animateStatCell('stat-bowler-wkts', bowler.wickets);
    const eco = bowler.overs > 0 || bowler.ballsInCurrentOver > 0
      ? (bowler.runsConceded / Math.max(0.1, bowler.overs + bowler.ballsInCurrentOver / 6)).toFixed(1)
      : '—';
    const ecoEl = document.getElementById('stat-bowler-eco');
    if (ecoEl) {
      ecoEl.textContent = eco;
      const ecoNum = parseFloat(eco);
      ecoEl.className = 'sb-stat-cell ' + (ecoNum < 7 ? 'sb-eco-green' : ecoNum < 9 ? 'sb-eco-amber' : 'sb-eco-red');
    }
  }

  // ── Partnership Bar ────────────────────────────────────────────────────────
  animateRunsTo('p-runs', pRuns);
  setText('p-balls', `(${pBalls})`);
  setText('p-striker-name', striker?.name || '—');
  setText('p-nonstriker-name', nonStriker?.name || '—');
  const totalContrib = (striker?.runs || 0) + (nonStriker?.runs || 0);
  const strikerPct = totalContrib > 0 ? ((striker?.runs || 0) / totalContrib) * 100 : 50;
  const strikerBar = document.getElementById('p-striker-bar');
  if (strikerBar) strikerBar.style.width = `${strikerPct}%`;
  const prr = pBalls > 0 ? ((pRuns / pBalls) * 6).toFixed(1) : '0.0';
  setText('p-rr', prr);

  // ── Score Ticker ───────────────────────────────────────────────────────────
  renderTicker(s, bat, bwl, md, striker, nonStriker, bowler, crr, rrr);

  // ── Flash detection ────────────────────────────────────────────────────────
  const recentBalls = md.recentBalls || [];
  if (recentBalls.length > prevBallCount) {
    const newBall = recentBalls[recentBalls.length - 1];
    detectFlash(newBall);
  }
  prevBallCount = recentBalls.length;
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function setText(id, val) {
  const el = document.getElementById(id);
  if (el && el.textContent !== String(val)) el.textContent = String(val);
}

function setLogo(id, url) {
  const el = document.getElementById(id);
  if (!el) return;
  if (url) { el.src = url; el.style.display = ''; }
  else el.style.display = 'none';
}

function setBadgeColor(id, color) {
  const el = document.getElementById(id);
  if (el && color) el.style.background = color;
}

function calcSR(runs, balls) {
  return balls > 0 ? ((runs / balls) * 100).toFixed(1) : '0.0';
}

// Slot machine digit roll
const digitPrevValues = {};
function rollDigits(id, newVal) {
  const el = document.getElementById(id);
  if (!el) return;
  const prev = digitPrevValues[id];
  if (prev === newVal) return;
  digitPrevValues[id] = newVal;
  el.textContent = newVal;
  el.classList.remove('rolling');
  void el.offsetWidth; // force reflow
  el.classList.add('rolling');
}

// Animated stat cell (slide-up on change)
const statPrevValues = {};
function animateStatCell(id, newVal) {
  const el = document.getElementById(id);
  if (!el) return;
  const prev = statPrevValues[id];
  if (prev === newVal) { el.textContent = String(newVal); return; }
  statPrevValues[id] = newVal;
  el.style.animation = 'none';
  el.textContent = String(newVal);
  void el.offsetWidth;
  el.style.animation = 'sb-slot-in 0.28s cubic-bezier(0.34,1.3,0.64,1) both';
}

// Animate partnership runs counter
const runsPrev = {};
function animateRunsTo(id, newVal) {
  const el = document.getElementById(id);
  if (!el) return;
  if (runsPrev[id] === newVal) return;
  runsPrev[id] = newVal;
  el.style.animation = 'none';
  el.textContent = String(newVal);
  void el.offsetWidth;
  el.style.animation = 'sb-slot-in 0.3s cubic-bezier(0.34,1.3,0.64,1) both';
}

// Render ball chips
let prevBallsJson = '';
function renderBallChips(balls) {
  const json = JSON.stringify(balls);
  if (json === prevBallsJson) return;
  const wasLess = balls.length > (JSON.parse(prevBallsJson || '[]')).length;
  prevBallsJson = json;

  const container = document.getElementById('ball-chips-container');
  if (!container) return;

  const recent = balls.slice(-6);
  const empties = Math.max(0, 6 - recent.length);

  container.innerHTML = '';
  recent.forEach((ball, i) => {
    const chip = document.createElement('span');
    chip.className = 'sb-ball-chip' + (i === recent.length - 1 && wasLess ? ' new' : '');
    chip.style.background = getBallColor(ball);
    chip.textContent = ball === '0' ? '•' : ball.length > 2 ? ball.slice(0, 2) : ball;
    container.appendChild(chip);
  });
  for (let i = 0; i < empties; i++) {
    const chip = document.createElement('span');
    chip.className = 'sb-ball-chip empty';
    container.appendChild(chip);
  }
}

function getBallColor(ball) {
  const map = {
    '6': 'var(--sb-ball-dot-6)', '4': 'var(--sb-ball-dot-4)',
    'W': 'var(--sb-ball-dot-w)', 'WD': 'var(--sb-ball-dot-wd)',
    'NB': 'var(--sb-ball-dot-nb)', '0': 'var(--sb-ball-dot-0)',
  };
  return map[ball] || 'var(--sb-ball-dot-1)';
}

// ─────────────────────────────────────────────────────────────────────────────
// TICKER
// ─────────────────────────────────────────────────────────────────────────────
let prevTickerContent = '';
function renderTicker(s, bat, bwl, md, striker, nonStriker, bowler, crr, rrr) {
  const recentBalls = md.recentBalls || [];
  const content = buildTickerContent(bat, bwl, md, striker, nonStriker, bowler, crr, rrr, recentBalls);
  const tc = document.getElementById('ticker-content');
  if (tc && content !== prevTickerContent) {
    prevTickerContent = content;
    tc.innerHTML = content;
  }
}

function buildTickerContent(bat, bwl, md, striker, nonStriker, bowler, crr, rrr, recentBalls) {
  let html = '';
  const sep = '<span class="sb-sep">│</span>';

  html += `<span class="sb-accent" style="font-weight:900;margin-right:8px">${bat.shortName || bat.fullName}</span>`;
  html += `<span style="font-weight:900;font-size:14px;color:var(--sb-text-accent)">${bat.score}/${bat.wickets}</span>`;
  html += sep;
  html += `<span style="opacity:0.7">${bat.overs}.${bat.balls}/${md.totalOvers || 20}</span>`;
  html += sep;
  html += `<span>CRR <span style="color:var(--sb-accent-primary);font-weight:900">${crr}</span></span>`;
  if (rrr && md.targetRuns) {
    html += `<span style="margin:0 4px;opacity:0.3">·</span>`;
    html += `<span>RRR <span style="color:#f87171;font-weight:900">${rrr}</span></span>`;
  }
  if (md.targetRuns) {
    html += sep;
    html += `<span style="font-weight:900;color:var(--sb-flash-four)">TGT ${md.targetRuns}</span>`;
  }
  html += sep;
  if (striker) {
    html += `<span><span style="color:var(--sb-accent-primary)">▶ </span>${striker.name} <span style="font-weight:900">${striker.runs}*</span><span style="opacity:0.6"> (${striker.balls})</span></span>`;
  }
  if (nonStriker) {
    html += `<span style="margin:0 4px;opacity:0.3">·</span>`;
    html += `<span style="opacity:0.75">${nonStriker.name} ${nonStriker.runs} (${nonStriker.balls})</span>`;
  }
  html += sep;
  if (bowler) {
    html += `<span style="opacity:0.8">${bowler.name} <span style="font-weight:900">${bowler.wickets}-${bowler.runsConceded}</span></span>`;
  }
  html += sep;
  html += `<span style="font-size:9px;text-transform:uppercase;letter-spacing:0.2em;opacity:0.5;margin-right:4px">THIS OVER</span>`;
  recentBalls.slice(-6).forEach((ball, i, arr) => {
    const isNew = i === arr.length - 1 && arr.length > (JSON.parse(prevBallsJson || '[]')).length;
    html += `<span class="sb-ticker-ball${isNew ? ' new' : ''}" style="background:${getBallColor(ball)}">${ball === '0' ? '•' : ball.slice(0,2)}</span>`;
  });
  if (md.customInputText || md.winnerMargin) {
    html += sep;
    html += `<span style="font-weight:900;text-transform:uppercase;letter-spacing:0.1em;color:var(--sb-accent-primary)">${md.customInputText || md.winnerMargin}</span>`;
  }
  return html;
}

// ─────────────────────────────────────────────────────────────────────────────
// FLASH ENGINE
// ─────────────────────────────────────────────────────────────────────────────
function detectFlash(ball) {
  if (!ball) return;
  if (ball === 'W')              triggerFlash('wicket', 4000);
  else if (ball === '6')         triggerFlash('six',    3500);
  else if (ball === '4')         triggerFlash('four',   3000);
  else if (ball === 'WD' || ball === 'NB') triggerFlash('extra', 2500);
}

function triggerFlash(type, duration) {
  if (flashTimer) clearTimeout(flashTimer);

  const strip = document.getElementById('score-strip');
  if (strip) strip.setAttribute('data-flash', type);

  // Ticker flash
  const tf = document.getElementById('ticker-flash');
  if (tf) {
    const labels = { four: '🚀 FOUR!', six: '🔥 MAXIMUM SIX!', wicket: '⚡ WICKET!', extra: '⚠ EXTRA' };
    tf.textContent = labels[type] || '';
    tf.setAttribute('data-type', type);
    tf.className = 'sb-ticker-flash active';
  }

  // Celebration
  const t = currentTheme || THEMES.classic;
  if (t.celebration === 'page-center' && (type === 'six' || type === 'four' || type === 'wicket')) {
    triggerPageCenter(type);
  }

  flashTimer = setTimeout(() => {
    if (strip) strip.removeAttribute('data-flash');
    if (tf) { tf.className = 'sb-ticker-flash'; tf.textContent = ''; }
  }, duration);
}

// ─────────────────────────────────────────────────────────────────────────────
// PAGE CENTER CELEBRATION
// ─────────────────────────────────────────────────────────────────────────────
function triggerPageCenter(type) {
  if (celebTimer) clearTimeout(celebTimer);

  const configs = {
    four:   { emoji:'🚀', label:'FOUR!',    sub:'BOUNDARY',  bg:'linear-gradient(135deg,#f59e0b,#fbbf24,#f97316)', color:'#000' },
    six:    { emoji:'🔥', label:'MAXIMUM!', sub:'SIX',       bg:'linear-gradient(135deg,#16a34a,#22c55e,#00f5ff)', color:'#fff' },
    wicket: { emoji:'⚡', label:'WICKET!',  sub:'OUT',        bg:'linear-gradient(135deg,#dc2626,#ef4444,#f97316)', color:'#fff' },
  };
  const c = configs[type];

  document.getElementById('cel-emoji').textContent = c.emoji;
  document.getElementById('cel-label').textContent = c.label;
  document.getElementById('cel-label').style.color = c.color;
  document.getElementById('cel-sub').textContent = c.sub;
  document.getElementById('cel-sub').style.color = c.color;

  const striker = state?.teamA?.batters?.find(b => b.isStriker) || state?.teamB?.batters?.find(b => b.isStriker);
  const batter = document.getElementById('cel-batter');
  batter.textContent = striker?.name || '';
  batter.style.color = c.color;

  const card = document.getElementById('celebration-card');
  card.style.background = c.bg;

  // Spawn particles
  spawnParticles(type);

  const overlay = document.getElementById('celebration-overlay');
  overlay.classList.add('active');

  celebTimer = setTimeout(() => {
    overlay.classList.remove('active');
    document.querySelectorAll('.sb-particle').forEach(p => p.remove());
  }, 3500);
}

function spawnParticles(type) {
  const colors = {
    four:   ['#f59e0b','#fbbf24','#fff','#fde68a'],
    six:    ['#22c55e','#4ade80','#00f5ff','#fff'],
    wicket: ['#ef4444','#f87171','#ffd700','#fff'],
  };
  const cols = colors[type] || colors.six;
  const overlay = document.getElementById('celebration-overlay');
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;

  for (let i = 0; i < 70; i++) {
    const p = document.createElement('div');
    const angle = Math.random() * Math.PI * 2;
    const speed = 120 + Math.random() * 280;
    const tx = Math.cos(angle) * speed;
    const ty = Math.sin(angle) * speed - 80;
    const rot = Math.random() * 720 - 360;
    const size = 5 + Math.random() * 9;
    const delay = Math.random() * 180;
    const dur = 900 + Math.random() * 600;
    const isCircle = Math.random() > 0.5;

    p.className = 'sb-particle';
    p.style.cssText = `
      left:${cx}px; top:${cy}px;
      width:${size}px; height:${isCircle ? size : size * 2.5}px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      border-radius:${isCircle ? '50%' : '2px'};
      --tx:${tx}px; --ty:${ty}px; --rot:${rot}deg;
      --dur:${dur}ms; --delay:${delay}ms;
      animation:sb-particle var(--dur) ease-out var(--delay) both;
      position:fixed; z-index:1000; pointer-events:none;
    `;
    overlay.appendChild(p);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// DATA SYNC
// ─────────────────────────────────────────────────────────────────────────────

// Load initial state from localStorage
function loadInitialState() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      render(parsed);
      return;
    }
  } catch(e) {}
  render(defaultState);
}

// BroadcastChannel listener
if (typeof BroadcastChannel !== 'undefined') {
  const bc = new BroadcastChannel(CHANNEL_NAME);
  bc.onmessage = (e) => {
    if (e.data?.type === 'AR_SPORTS_STATE_SYNC' && e.data?.payload) {
      render(e.data.payload);
    }
    if (e.data?.type === 'SB_SET_THEME' && e.data?.themeId && THEMES[e.data.themeId]) {
      applyTheme(e.data.themeId);
    }
  };
}

// localStorage change listener (cross-tab)
window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY && e.newValue) {
    try { render(JSON.parse(e.newValue)); } catch(_) {}
  }
  if (e.key === THEME_STORAGE && e.newValue && THEMES[e.newValue]) {
    applyTheme(e.newValue);
  }
});

// Custom event from same-tab store
window.addEventListener('ar_sports_local_update', (e) => {
  if (e.detail) render(e.detail);
});

// postMessage (from OBS custom panel or parent iframe)
window.addEventListener('message', (e) => {
  if (e.data?.type === 'SB_SET_THEME' && THEMES[e.data.themeId]) {
    applyTheme(e.data.themeId);
  }
  if (e.data?.type === 'SB_STATE_UPDATE') {
    render(e.data.payload);
  }
});

// Optional WebSocket connection
if (WS_URL) {
  let ws;
  function connectWS() {
    ws = new WebSocket(WS_URL);
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'STATE_SYNC' && msg.payload) render(msg.payload);
      } catch(_) {}
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
  }
  connectWS();
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
(function init() {
  // Parse theme from URL
  const urlParams = new URLSearchParams(window.location.search);
  const urlTheme = urlParams.get('theme');
  let initialTheme = 'classic';

  if (urlTheme && THEMES[urlTheme]) initialTheme = urlTheme;
  else {
    try {
      const stored = localStorage.getItem(THEME_STORAGE);
      if (stored && THEMES[stored]) initialTheme = stored;
    } catch(_) {}
  }

  applyTheme(initialTheme);
  loadInitialState();

  // Poll localStorage every 200ms as fallback for same-tab updates
  setInterval(() => {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) render(JSON.parse(stored));
    } catch(_) {}
  }, 300);
})();
</script>
